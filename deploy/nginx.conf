# Web 容器 nginx 配置（M2-OPS-01）：静态前端 + /api 反代到 api 容器。
# SSE（GET /api/v1/projects/:id/events）必须关闭缓冲并给足读超时——
# 服务端按 SSE_MAX_AGE 自行结束连接，客户端 EventSource 带 Last-Event-ID 自动重连。
# api 容器滚动更新会换 IP：nginx 对 proxy_pass 主机名只在启动时解析一次，之后 502。
# 用 Docker 内嵌 DNS（127.0.0.11）+ 变量让每次请求重新解析（变量形式 proxy_pass 不缓存）。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 静态资源带指纹，长缓存；index.html 不缓存（发版即生效）
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /api/ {
    set $api_upstream "http://api:3000";
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE 关键：响应不缓冲、连接不复用池化；读超时大于服务端 SSE 最大存活期
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection "";
    proxy_read_timeout 15m;
    # 常规接口的提交上限（故事文本 2MB 级，给足余量）
    client_max_body_size 20m;
  }

  location / {
    try_files $uri /index.html;
  }
}
